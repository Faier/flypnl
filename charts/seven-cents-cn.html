<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 675px; overflow: hidden;
    background: linear-gradient(to bottom right, rgb(12, 125, 125), rgb(24, 33, 123));
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .window {
    width: 1040px;
    background: #1d2433; border-radius: 14px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
    padding: 26px 34px 42px;
  }
  .bar { display: flex; align-items: center; gap: 9px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tag {
    margin-left: 14px; font: 600 17px/1 "SF Mono", Menlo, monospace;
    color: #7dd3c0; letter-spacing: 1px;
  }
  .title {
    margin-top: 28px; font-size: 50px; font-weight: 900; line-height: 1.35;
    color: #ffffff; letter-spacing: 1px;
  }
  .stats { display: flex; align-items: flex-end; gap: 40px; margin: 30px 0 30px; }
  .num { font-size: 80px; font-weight: 800; line-height: 1; }
  .label { margin-top: 12px; font-size: 19px; color: #8b96a8; }
  .body {
    font-size: 30px; font-weight: 600; line-height: 1.65; color: #c9d2de;
    letter-spacing: 1px;
  }
  .body b { color: #ffd166; font-weight: 800; }
  .source { margin-top: 24px; font-size: 16px; color: #6b7688; letter-spacing: .5px; }
</style>
</head>
<body>
  <div class="window">
    <div class="bar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <span class="tag">flypnl · DAY 3</span>
    </div>
    <div class="title">我的系统今天挣了 7 分钱。<br>故意的。</div>
    <div class="stats">
      <div><div class="num" style="color:#6a9ef0">$0.07</div><div class="label">每天 · 40U 名义费率仓</div></div>
      <div><div class="num" style="color:#7dd3c0">+61.5%</div><div class="label">trailing 7 桶年化</div></div>
      <div><div class="num" style="color:#ffd166">5天</div><div class="label">摊平进场成本</div></div>
    </div>
    <div class="body">账本是产品，<b>盈利只是副产品。</b></div>
    <div class="source">github.com/Faier/flypnl · 2026-10-21 · 不构成投资建议</div>
  </div>
</body>
</html>

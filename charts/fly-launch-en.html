<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 675px; overflow: hidden;
    background: linear-gradient(to bottom right, rgb(12, 125, 125), rgb(24, 33, 123));
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  .window {
    width: 1060px;
    background: #1d2433; border-radius: 14px;
    box-shadow: 0 30px 60px rgba(0,0,0,.45);
    padding: 30px 38px 38px;
    display: flex; gap: 40px; align-items: center;
  }
  .photo {
    flex: 0 0 470px;
  }
  .photo img {
    width: 470px; height: 365px; object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 14px 34px rgba(0,0,0,.5);
    display: block;
  }
  .credit {
    margin-top: 10px; font-size: 13px; color: #6b7688; letter-spacing: .3px;
  }
  .right { flex: 1; }
  .bar { display: flex; align-items: center; gap: 9px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tag {
    margin-left: 12px; font: 600 16px/1 "SF Mono", Menlo, monospace;
    color: #7dd3c0; letter-spacing: 1px;
  }
  .title {
    margin-top: 20px; font-size: 47px; font-weight: 900; line-height: 1.28;
    color: #ffffff; letter-spacing: .3px;
  }
  .title .fly { color: #ff8a5c; }
  .body {
    margin-top: 22px; font-size: 26px; font-weight: 600; line-height: 1.6;
    color: #c9d2de;
  }
  .body b { color: #ffd166; font-weight: 800; }
  .chips { display: flex; gap: 12px; margin-top: 24px; }
  .chip {
    font: 700 18px/1 "SF Mono", Menlo, monospace; letter-spacing: .5px;
    color: #7dd3c0; background: rgba(125,211,192,.12);
    border: 1px solid rgba(125,211,192,.35);
    padding: 10px 16px; border-radius: 999px;
  }
  .source {
    margin-top: 22px; font-size: 16px; color: #6b7688; letter-spacing: .4px;
  }
  .source b { color: #8fa3bd; font-weight: 700; }
</style>
</head>
<body>
  <div class="window">
    <div class="photo">
      <img src="assets/fly-photo.jpg" alt="drosophila macro">
      <div class="credit">Photo: André Karwath · CC BY-SA 2.5</div>
    </div>
    <div class="right">
      <div class="bar">
        <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
        <span class="tag">flypnl · DAY 0</span>
      </div>
      <div class="title">Next: quant trading,<br>run by a <span class="fly">fruit-fly brain</span></div>
      <div class="body">A real connectome neural network + <b>JEV</b>, an AI advisor watching every move. Live with real money.</div>
      <div class="chips">
        <span class="chip">● REAL MONEY</span>
        <span class="chip">● OPEN SOURCE</span>
      </div>
      <div class="source"><b>github.com/Faier/flypnl</b> · not financial advice</div>
    </div>
  </div>
</body>
</html>

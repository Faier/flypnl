<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 675px; overflow: hidden;
    background: #12161f;
    display: flex;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .photo-side {
    position: relative;
    flex: 0 0 530px; height: 675px;
  }
  .photo-side img {
    width: 100%; height: 100%; object-fit: cover; object-position: 22% 45%;
    display: block;
    filter: saturate(1.05);
  }
  .photo-side::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to right, rgba(18,22,31,0) 72%, #12161f 100%);
  }
  .credit {
    position: absolute; left: 18px; bottom: 14px; z-index: 2;
    font-size: 13px; color: rgba(255,255,255,.55);
    text-shadow: 0 1px 3px rgba(0,0,0,.8); letter-spacing: .3px;
  }
  .text-side {
    flex: 1; height: 675px;
    padding: 54px 58px 46px 50px;
    display: flex; flex-direction: column;
  }
  .bar { display: flex; align-items: center; gap: 9px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; }
  .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }
  .tag {
    margin-left: 12px; font: 600 17px/1 "SF Mono", Menlo, monospace;
    color: #56c9a8; letter-spacing: 1px;
  }
  .title {
    margin-top: 34px; font-size: 64px; font-weight: 900; line-height: 1.3;
    color: #ffffff; letter-spacing: 1px;
  }
  .title .fly { color: #ff8a5c; }
  .body {
    margin-top: 28px; font-size: 28px; font-weight: 600; line-height: 1.62;
    color: #c9d2de; letter-spacing: .5px;
  }
  .body b { color: #ffd166; font-weight: 800; }
  .spacer { flex: 1; }
  .chips { display: flex; gap: 14px; }
  .chip {
    font: 700 19px/1 "SF Mono", Menlo, monospace; letter-spacing: .5px;
    color: #56c9a8; background: rgba(86,201,168,.10);
    border: 1px solid rgba(86,201,168,.4);
    padding: 12px 20px; border-radius: 999px;
  }
  .source {
    margin-top: 26px; font-size: 18px; color: #6b7688; letter-spacing: .4px;
  }
  .source b { color: #93a6c0; font-weight: 700; }
</style>
</head>
<body>
  <div class="photo-side">
    <img src="assets/fly-photo.jpg" alt="果蝇微距实拍">
    <div class="credit">果蝇实拍 Photo: André Karwath · CC BY-SA 2.5</div>
  </div>
  <div class="text-side">
    <div class="bar">
      <div class="dot r"></div><div class="dot y"></div><div class="dot g"></div>
      <span class="tag">flypnl · DAY 0</span>
    </div>
    <div class="title">真金白银,<br>交给<span class="fly">果蝇大脑</span><br>来跑</div>
    <div class="body">真连接组神经网络 + <b>JEV(AI 顾问)</b><br>盯每一步。</div>
    <div class="spacer"></div>
    <div class="chips">
      <span class="chip">● 实盘资金</span>
      <span class="chip">● 全部开源</span>
    </div>
    <div class="source"><b>github.com/Faier/flypnl</b> · 不构成投资建议</div>
  </div>
</body>
</html>
